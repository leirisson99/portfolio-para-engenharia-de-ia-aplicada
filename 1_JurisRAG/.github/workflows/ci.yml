name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jurisrag
          POSTGRES_PASSWORD: jurisrag
          POSTGRES_DB: jurisrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jurisrag:jurisrag@localhost:5432/jurisrag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest

  # Job de avaliação (RN02/RN03/RF04) entra aqui como parte da feature F8 —
  # ver 1_JurisRAG/specs-projeto/feature-08-ci-cd-gate/spec.md.
